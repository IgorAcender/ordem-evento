<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pré-reserva · Auge Drinks</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Formulário em blocos com toque grande; botão de gerar fixo no rodapé */
:root{
  --bg:#f6f4ef; --surface:#fff; --fg:#1f1d1a; --muted:#6d6860; --line:#e3ded4;
  --accent:#b8611a; --accent-soft:#f6e6d6; --ok:#2f7a4f;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16140f; --surface:#211e18; --fg:#f1ece3; --muted:#a39b8e; --line:#353028;
  --accent:#e89a52; --accent-soft:#3a2a1a; --ok:#6cc792; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.back{align-self:flex-start;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;padding:6px 0}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:2px 0 4px;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:46px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.full{grid-column:1/-1}
label{display:grid;gap:5px;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;min-width:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;width:100%;text-transform:none;letter-spacing:0;min-width:0}
textarea{min-height:110px;resize:none;overflow:hidden;field-sizing:content;line-height:1.5}
textarea.sm{min-height:50px}
.extras{display:grid;gap:14px}
.extras:empty{display:none}
.extra{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.extra .top{display:flex;gap:8px;align-items:center}
.extra .top input{font-weight:600}
.extra .rm{flex:none;padding:10px 12px;font-size:.9rem;color:var(--muted)}
.extra .rm.sure{color:#c0392b;border-color:#c0392b}
button.add{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qty input{text-align:center;font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;padding:10px 4px}
.hint{font-size:.82rem;color:var(--muted);margin:-4px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-weight:600;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{flex:1;background:var(--accent);border-color:var(--accent);color:#fff;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.pdfLink{display:block;text-align:center;padding:14px;border:2px dashed var(--accent);border-radius:12px;color:var(--accent);font-weight:600;text-decoration:none}
.confirm{display:none;gap:8px;align-items:center;flex:1}
.confirm.on{display:flex}
.confirm span{font-size:.9rem;flex:1}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Início</a>
  <div>
    <div class="eyebrow">Pré-reserva</div>
    <h1>Novo evento</h1>
    <p class="lead">Preencha e toque em Gerar PDF para confirmar o evento.</p>
  </div>

  <section class="card">
    <h2>Evento</h2>
    <div class="grid">
      <label class="full">Evento<input id="evento"></label>
      <label class="full">Local<input id="local"></label>
      <label class="full">Endereço<input id="endereco"></label>
      <label class="full">Data<input id="data" type="date"></label>
      <label>Início<input id="inicio" type="time"></label>
      <label>Término<input id="fim" type="time"></label>
      <label class="full">Observação do horário<textarea class="sm" id="obsHora"></textarea></label>
    </div>
  </section>

  <section class="card">
    <h2>Equipe</h2>
    <div class="grid">
      <label class="full">Equipe<textarea class="sm" id="equipe"></textarea></label>
      <label class="full">Barback<textarea class="sm" id="barback"></textarea></label>
      <label class="full">Uniforme<textarea class="sm" id="uniforme"></textarea></label>
      <label class="full">Observação<textarea class="sm" id="observacao"></textarea></label>
    </div>
  </section>

  <section class="card">
    <h2>Campos extras</h2>
    <div id="extras" class="extras"></div>
    <button type="button" id="addExtra" class="add">+ Adicionar campo</button>
  </section>

  <section class="card">
    <h2>Responsável</h2>
    <label>Nome do responsável<input id="responsavel"></label>
  </section>
</div>

<div class="bar"><div class="in">
  <button id="btnClear" type="button">Limpar</button>
  <div class="confirm" id="confirm"><span>Apagar tudo?</span><button id="yes" type="button">Sim</button><button id="no" type="button">Não</button></div>
  <button class="primary" id="btnPdf" type="button">Gerar PDF</button>
</div></div>
<div class="toast" id="toast" role="status"></div>

</script>
<script>
const IDS=["evento","local","endereco","data","inicio","fim","obsHora","equipe","barback","uniforme","observacao","responsavel"];
const KEY="pre-reserva-rascunho";
const $=id=>document.getElementById(id);
const v=id=>$(id).value.trim();
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
IDS.forEach(id=>{if(saved[id]!=null)$(id).value=saved[id];$(id).addEventListener("input",()=>{saved[id]=$(id).value;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}})});

// campo de drinks cresce conforme o texto
const grow=t=>{t.style.height="auto";t.style.height=t.scrollHeight+2+"px"};
document.querySelectorAll("textarea").forEach(t=>{grow(t);t.addEventListener("input",()=>grow(t))});

// campos extras: título livre + texto
let extras=Array.isArray(saved.extras)?saved.extras:[];
const saveExtras=()=>{saved.extras=extras;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
function renderExtras(focusLast){
  const box=$("extras");box.innerHTML="";
  extras.forEach((x,i)=>{
    const d=document.createElement("div");d.className="extra";
    d.innerHTML=`<div class="top"><input id="ext_t_${i}" placeholder="Título do campo" aria-label="Título do campo"><button type="button" class="rm">Remover</button></div><textarea class="sm" id="ext_v_${i}" aria-label="Conteúdo do campo"></textarea>`;
    const t=d.querySelector("input"),ta=d.querySelector("textarea"),rm=d.querySelector(".rm");
    t.value=x.t||"";ta.value=x.v||"";
    t.oninput=()=>{x.t=t.value;saveExtras()};
    ta.oninput=()=>{x.v=ta.value;saveExtras();grow(ta)};
    rm.onclick=()=>{
      if(!rm.classList.contains("sure")){rm.classList.add("sure");rm.textContent="Confirmar";setTimeout(()=>{rm.classList.remove("sure");rm.textContent="Remover"},3000);return}
      extras.splice(i,1);saveExtras();renderExtras();
    };
    box.appendChild(d);grow(ta);
    if(focusLast&&i===extras.length-1)t.focus();
  });
}
$("addExtra").onclick=()=>{extras.push({t:"",v:""});saveExtras();renderExtras(true)};
renderExtras();

const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)};

// limpar com confirmação
$("btnClear").onclick=()=>{$("confirm").classList.add("on");$("btnClear").hidden=true;$("btnPdf").hidden=true};
const closeC=()=>{$("confirm").classList.remove("on");$("btnClear").hidden=false;$("btnPdf").hidden=false};

$("btnPdf").onclick=async()=>{
  if(!window.jspdf){toast("Erro ao carregar o gerador de PDF");return}
  if(!v("evento")){toast("Preencha o nome do evento");$("evento").focus();return}
  const {jsPDF}=window.jspdf;
  const build=PH=>{
  const doc=new jsPDF({unit:"mm",format:[210,PH]});
  const W=210,M=12,CW=W-2*M,G=3.5,C2=(CW-G)/2;
  const K=[17,17,17],GR=[70,70,70],WH=[255,255,255];
  const T=Object.assign({page:null,hd:K,hdLbl:WH,bd:[60,60,60],bw:.45,fill:null,lb:GR,ic:K,dv:[60,60,60]},window.PDF_THEME||THEME);
  const BD=T.bd,HOLE=T.fill||WH;
  if(T.page){doc.setFillColor(...T.page);doc.rect(0,0,W,PH,"F")}
  const pt=0.3528;
  const font=(st,sz,col)=>{doc.setFont("helvetica",st);doc.setFontSize(sz);doc.setTextColor(...col)};
  const box=(x,yy,w,h)=>{if(T.fill){doc.setFillColor(...T.fill)}if(T.bd){doc.setDrawColor(...T.bd);doc.setLineWidth(T.bw)}doc.roundedRect(x,yy,w,h,2.2,2.2,T.fill&&T.bd?"FD":T.fill?"F":"S")};
  let y=M;
  const ensure=h=>{}; // página única, altura ajustada ao conteúdo

  // ===== cabeçalho preto com logo =====
  const LS=40, leftW=CW-LS-24;
  const nomeEv=v("evento").toUpperCase();
  let fs=72,ev;
  doc.setFont("helvetica","bold");
  for(;;){doc.setFontSize(fs);ev=doc.splitTextToSize(nomeEv,leftW);if(ev.length===1||fs<=34)break;fs-=2}
  while(ev.length>2&&fs>20){fs-=2;doc.setFontSize(fs);ev=doc.splitTextToSize(nomeEv,leftW)}
  ev=ev.slice(0,2);
  const evLH=fs*pt*0.95;
  const leftH=17+fs*pt*0.72+(ev.length-1)*evLH+8;
  const HH=Math.max(leftH,LS+10);
  doc.setFillColor(...T.hd);doc.roundedRect(M,y,CW,HH,3,3,"F");
  font("bold",13,T.hdLbl);doc.text("PRÉ-RESERVA",M+8,y+12,{charSpace:.6});
  font("bold",fs,WH);
  const evTop=y+(HH-(leftH-17))/2+fs*pt*0.72+3;
  ev.forEach((l,i)=>doc.text(l,M+7,Math.max(evTop,y+17+fs*pt*0.72)+i*evLH));
  try{doc.addImage(LOGO,"PNG",M+CW-LS-6,y+(HH-LS)/2,LS,LS)}catch(e){}
  y+=HH+G;

  const LBL=(t,x,yy)=>{font("normal",10.5,T.lb);doc.text(t.toUpperCase(),x,yy,{charSpace:.2})};
  // ===== data e local (50% / 50%) =====
  {
    let semana="";
    if(v("data")){try{semana=new Date(v("data")+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long"});semana=semana.charAt(0).toUpperCase()+semana.slice(1).split("-")[0]}catch(e){}}
    const tw=C2-22;
    doc.setFont("helvetica","bold");doc.setFontSize(18);
    const locL=doc.splitTextToSize(v("local")||"—",tw).slice(0,3);
    doc.setFont("helvetica","normal");doc.setFontSize(11);
    const endL=v("endereco")?doc.splitTextToSize(v("endereco"),tw).slice(0,3):[];
    const hD=12+11+(semana?6:0)+5;
    const hL=12+locL.length*7+endL.length*5+5;
    const h=Math.max(hD,hL,30);
    box(M,y,C2,h);box(M+C2+G,y,C2,h);
    // ícone calendário (preto)
    const ix=M+6,iy=y+7;
    doc.setFillColor(...T.ic);doc.roundedRect(ix,iy,9,9,1.4,1.4,"F");
    doc.setFillColor(...HOLE);doc.rect(ix+1,iy+2.8,7,5.2,"F");
    doc.setFillColor(...T.ic);for(let r=0;r<2;r++)for(let c=0;c<3;c++)doc.rect(ix+1.7+c*2.2,iy+3.6+r*2.2,1.3,1.3,"F");
    doc.setFillColor(...HOLE);doc.rect(ix+2.1,iy-0.6,1,1.8,"F");doc.rect(ix+5.9,iy-0.6,1,1.8,"F");
    const tx=ix+13;
    LBL("Data",tx,y+9);
    font("bold",24,K);doc.text(v("data")?dataBR(v("data")):"—",tx,y+19.5);
    if(semana){font("normal",12,GR);doc.text(semana,tx,y+25.5)}
    // ícone local (preto)
    const lx=M+C2+G+6,pcx=lx+4.5,pcy=y+10.5;
    doc.setFillColor(...T.ic);doc.circle(pcx,pcy,3.4,"F");doc.triangle(pcx-3,pcy+1.7,pcx+3,pcy+1.7,pcx,pcy+7.4,"F");
    doc.setFillColor(...HOLE);doc.circle(pcx,pcy,1.25,"F");
    const ltx=lx+13;
    LBL("Local",ltx,y+9);
    font("bold",18,K);locL.forEach((l,i)=>doc.text(l,ltx,y+18+i*7));
    if(endL.length){font("normal",11,GR);endL.forEach((l,i)=>doc.text(l,ltx,y+18+locL.length*7-1.5+i*5))}
    y+=h+G;
  }

  // ===== caixas =====
  const prep=(c,w)=>{let h=11.5;c._p=c.parts.filter(p=>p.text).map(p=>{doc.setFont("helvetica",p.bold?"bold":"normal");doc.setFontSize(p.size);
      const ls=String(p.text).split("\n").map(s=>s.trim()).filter(Boolean).flatMap(t=>doc.splitTextToSize(t,w-12));const lh=p.size*pt*1.25;h+=ls.length*lh+1.2;return {...p,ls,lh}});
    if(!c._p.length){c._p=[{ls:["—"],lh:6,size:13,bold:false}];h+=7.2}
    return h+3.5};
  const drawC=(c,x,yy,w,h)=>{box(x,yy,w,h);LBL(c.label,x+6,yy+8);let cy=yy+11.5;
    c._p.forEach(p=>{font(p.bold?"bold":"normal",p.size,K);p.ls.forEach(l=>{doc.text(l,x+6,cy+p.size*pt*0.95);cy+=p.lh});cy+=1.2})};
  const row2=(a,b)=>{const h=Math.max(prep(a,C2),prep(b,C2));ensure(h);drawC(a,M,y,C2,h);drawC(b,M+C2+G,y,C2,h);y+=h+G};
  const row1=c=>{const h=prep(c,CW);ensure(h);drawC(c,M,y,CW,h);y+=h+G};

  const hora=[v("inicio"),v("fim")].filter(Boolean).join(" às ");
  row1({label:"Horário",parts:[{text:hora,size:17,bold:true},{text:v("obsHora"),size:10}]});

  if(v("equipe")||v("barback"))row2({label:"Equipe",parts:[{text:v("equipe"),size:14}]},{label:"Barback",parts:[{text:v("barback"),size:14}]});
  if(v("uniforme"))row1({label:"Uniforme",parts:[{text:v("uniforme"),size:14}]});
  if(v("observacao"))row1({label:"Observação",parts:[{text:v("observacao"),size:13}]});
  extras.forEach(x=>{const tv=(x.v||"").trim(),tt=(x.t||"").trim();if(tv||tt)row1({label:tt||"Informação",parts:[{text:tv,size:13}]})});

  // responsável + data de geração
  {const c={label:"Responsável",parts:[{text:v("responsavel"),size:20,bold:true}]};const h=prep(c,CW)+2;ensure(h);drawC(c,M,y,CW,h);
   const now=new Date();font("normal",8,GR);
   doc.text(`Gerado em ${now.toLocaleDateString("pt-BR")} às ${now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`,M+CW-6,y+h-4,{align:"right"});
   y+=h}
  return {doc,y,M};
  };
  const r1=build(3000);
  const {doc}=build(Math.max(r1.y+r1.M,170));

  const nome="pre-reserva-"+v("evento").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".pdf";
  const blob=doc.output("blob");
  // dentro do Claude: salva pela permissão de download da página
  if(window.claude&&window.claude.use){
    let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
    if(dl){
      try{await dl.save({filename:nome,data:blob});toast("PDF salvo")}
      catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Aguarde um instante e tente de novo");return}toast("Não foi possível salvar o PDF aqui")}
      return;
    }
  }
  const file=new File([blob],nome,{type:"application/pdf"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:v("evento")});return}
  }catch(e){if(e.name==="AbortError")return}
  try{doc.save(nome);toast("PDF gerado")}catch(e){}
  // plano B: link para abrir o PDF
  const url=URL.createObjectURL(blob);
  let a=$("pdfLink");
  if(!a){a=document.createElement("a");a.id="pdfLink";a.target="_blank";a.rel="noopener";a.className="pdfLink";document.querySelector(".wrap").appendChild(a)}
  a.href=url;a.download=nome;a.textContent="Se o PDF não abriu, toque aqui";
  a.scrollIntoView({behavior:"smooth",block:"center"});
};
</script>
</body>
</html>
