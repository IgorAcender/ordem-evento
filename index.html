<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auge Drinks</title>
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auge Drinks">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Tela inicial: logo no topo, lista de ferramentas em cards clicáveis */
:root{
  --bg:#141416; --surface:#1f1f22; --surface-2:#2a2a2e; --fg:#f3f1ec; --muted:#a29e96;
  --gold:#d6aa4a; --gold-soft:rgba(214,170,74,.14); --line:#2f2f33;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(circle at 50% 0,rgba(214,170,74,.12),transparent 55%)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand img{width:min(200px,52vw);height:auto;filter:drop-shadow(0 10px 30px rgba(214,170,74,.18))}
.brand p{margin:0;color:var(--muted);font-size:.95rem}
.sec{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 -14px}
.list{display:grid;gap:12px}
a.card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .15s,background .15s,transform .15s}
a.card:hover{border-color:var(--gold);background:var(--surface-2)}
a.card:active{transform:scale(.985)}
a.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold)}
.ic svg{width:26px;height:26px}
.txt{flex:1;min-width:0;display:grid;gap:2px}
.txt b{font-family:var(--display);font-weight:600;font-size:1.12rem}
.txt span{color:var(--muted);font-size:.9rem}
.arrow{flex:none;color:var(--muted);font-size:1.3rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <img src="logo.png" alt="Auge Drinks" width="520" height="520">
    <p>Ferramentas da equipe</p>
  </header>

  <h2 class="sec">Gerar documento</h2>
  <nav class="list">
    <a class="card" href="ordem-servico/">
      <div class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      </div>
      <div class="txt"><b>Ordem de Serviço</b><span>Dados do evento em PDF para a equipe</span></div>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
  </nav>
</div>
</body>
</html>
